# Default control panel settings: Marisol's choices (docs/decisions.md, decision 25).
#
# These are copied into the master sheet's _settings tab the first time the
# pipeline runs on a new sheet. After that, the sheet is the source of truth:
# change settings in the control panel, not in this file.
#
# If a value here is ever a stand-in waiting on a decision, list its section
# under [tbd]. While it still matches this file, the control panel warns that
# it hasn't been set yet, and alerts stay off.

# Alerts go to a Slack channel (decision 26), so no email addresses are needed.
# The email sender is kept but unused; this list is only for it.
alert_recipients = []

[tbd]
sections = []

[metrics]
ga4 = ["sessions", "totalUsers"]
search_console = ["clicks", "impressions"]

# Alert when a metric's latest 7 days are down this much on the 7 days before.
[alert_thresholds]
sessions = { drop_pct = 25 }
totalUsers = { drop_pct = 25 }
clicks = { drop_pct = 25 }
impressions = { drop_pct = 25 }
