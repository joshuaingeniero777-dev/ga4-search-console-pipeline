# Default control panel settings.
#
# These are copied into the master sheet's _settings tab the first time the
# pipeline runs. After that, the sheet is the source of truth: change settings
# in the control panel, not in this file.
#
# ---------------------------------------------------------------------------
# TBD: metrics, alert thresholds and alert recipients are PLACEHOLDERS.
# They are waiting on Marisol (docs/decisions.md, decision 17).
# While a section is listed under [tbd] below and still matches these values,
# the control panel shows a warning that it hasn't been set yet.
# When the real values are confirmed, put them here and remove the section
# from the [tbd] list.
# ---------------------------------------------------------------------------

# TBD placeholder. example.com is a reserved domain, so nothing can actually be
# delivered to this address.
alert_recipients = ["alerts-tbd@example.com"]

[tbd]
sections = ["metrics", "alert_thresholds", "alert_recipients"]

# TBD placeholder: a general starting set, not a confirmed choice.
[metrics]
ga4 = ["sessions", "totalUsers"]
search_console = ["clicks", "impressions"]

# TBD placeholder: alert when a metric drops by at least this many percent.
[alert_thresholds]
sessions = { drop_pct = 30 }
clicks = { drop_pct = 30 }
