# Runs the tests on every pull request: the Python pipeline and API (pytest)
# and the control panel in web/ (lint, types, tests, build). A PR is only
# merged once both pass.
#
# Tests never talk to Google, so no service-account.json, .env or other secrets
# exist here, and none should ever be added to make a test pass.

name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install -e .

      - name: Confirm no credentials are present
        run: test ! -e service-account.json && test ! -e .env

      - name: Run tests
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
